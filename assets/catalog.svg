    <rect class="bar0" x="250" y="4" width="320" height="24" rx="12"/>
    <text class="count" x="580" y="22">28</text>
  </g>
  <g transform="translate(0 362)">
    <text class="label" x="234" y="21" text-anchor="end">emails()</text>
    <rect class="track" x="250" y="4" width="560" height="24" rx="12"/>
