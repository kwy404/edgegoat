<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 554" width="900" height="554" role="img" aria-labelledby="t d">
  <title id="t">edgegoat catalog: 284 edge cases in 11 generators</title>
  <desc id="d">Bar chart of edge case counts: dates 46, timeZones 18, strings 49, numbers 26, numericStrings 17, bigints 8, urls 28, emails 26, paths 30, json 22, arrays 14.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .bg { fill: #FFFFFF; stroke: #D0D7DE; }
    .title { fill: #22303C; font-size: 26px; font-weight: 800; }
    .sub { fill: #57606A; font-size: 15px; }
    .label { fill: #22303C; font-size: 16px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .count { fill: #22303C; font-size: 15px; font-weight: 700; }
    .track { fill: #2E9C8A; fill-opacity: 0.1; }
    .bar0 { fill: #2E9C8A; } .bar1 { fill: #3BB09C; } .bar2 { fill: #F2A93B; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0D1117; stroke: #30363D; }
      .title, .label, .count { fill: #E6EDF3; }
      .sub { fill: #8B949E; }
      .track { fill-opacity: 0.18; }
    }
  </style>
  <rect class="bg" x="1" y="1" width="898" height="552" rx="16"/>
  <text class="title" x="40" y="50">284 edge cases, 11 generators</text>
  <text class="sub" x="40" y="75">Every case has a label, a value, a one line why, and tags for filtering.</text>
  <g transform="translate(0 96)">
    <text class="label" x="234" y="21" text-anchor="end">dates()</text>
    <rect class="track" x="250" y="4" width="560" height="24" rx="12"/>
    <rect class="bar0" x="250" y="4" width="526" height="24" rx="12"/>
